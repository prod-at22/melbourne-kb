    "pricing": "<h2>Harga & Pakej</h2>\n<p class='ssub'>Kadar katalog TO — per pax, 2–3 orang sebilik. Ground + Tipping (tanpa flight). CWB = Child With Bed (5–11 thn), CNB = Child Without Bed (2–4 thn). Infant flat RM1,000.</p>\n<div class='custblk'><h3>🐨 PT Melbourne Basic 5D4N</h3>\n<table class='ctbl'><thead><tr><th>Group of</th><th>Adult</th><th>Child With Bed</th><th>Child No Bed</th></tr></thead><tbody>\n<tr><td class='it'>2</td><td class='add'>RM 5,897</td><td>RM 5,697</td><td>RM 5,397</td></tr>\n<tr><td class='it'>3</td><td class='add'>RM 4,597</td><td>RM 4,397</td><td>RM 4,097</td></tr>\n<tr><td class='it'>4</td><td class='add'>RM 4,197</td><td>RM 3,997</td><td>RM 3,697</td></tr>\n<tr><td class='it'>5</td><td class='add'>RM 3,797</td><td>RM 3,597</td><td>RM 3,297</td></tr>\n<tr><td class='it'>6–7</td><td class='add'>RM 3,597</td><td>RM 3,397</td><td>RM 3,097</td></tr>\n<tr><td class='it'>8–10</td><td class='add'>RM 3,397</td><td>RM 3,197</td><td>RM 2,897</td></tr>\n</tbody></table>\n<p class='custnote'>Infant (bawah 2 thn): RM 1,000 flat. Pax 11+ : sila minta sebut harga (perlu kenderaan tambahan).</p></div>\n<div class='custblk'><h3>🐧 PT Melbourne Standard 5D4N</h3>\n<table class='ctbl'><thead><tr><th>Group of</th><th>Adult</th><th>Child With Bed</th><th>Child No Bed</th></tr></thead><tbody>\n<tr><td class='it'>2</td><td class='add'>RM 6,997</td><td>RM 6,797</td><td>RM 6,497</td></tr>\n<tr><td class='it'>3</td><td class='add'>RM 5,497</td><td>RM 5,297</td><td>RM 4,997</td></tr>\n<tr><td class='it'>4</td><td class='add'>RM 4,997</td><td>RM 4,797</td><td>RM 4,497</td></tr>\n<tr><td class='it'>5</td><td class='add'>RM 4,497</td><td>RM 4,297</td><td>RM 3,997</td></tr>\n<tr><td class='it'>6–7</td><td class='add'>RM 4,197</td><td>RM 3,997</td><td>RM 3,697</td></tr>\n<tr><td class='it'>8–10</td><td class='add'>RM 3,997</td><td>RM 3,797</td><td>RM 3,497</td></tr>\n</tbody></table>\n<p class='custnote'>Infant (bawah 2 thn): RM 1,000 flat. Pax 11+ : sila minta sebut harga.</p></div>",
    "custom": "<h2>Simple Customisation</h2>\n<div class='custblk'><h3>Add-On Private Day Tour (per transport)</h3>\n<table class='ctbl'><thead><tr><th>Day Tour</th><th>Durasi</th><th>Harga</th></tr></thead><tbody>\n<tr><td class='it'>Great Ocean Road (Basic sahaja)</td><td>12 jam</td><td class='add'>RM 2,800</td></tr>\n<tr><td class='it'>Puffing Billy & Dandenong</td><td>8 jam</td><td class='add'>RM 1,500</td></tr>\n<tr><td class='it'>Mornington Peninsula</td><td>8 jam</td><td class='add'>RM 1,600</td></tr>\n<tr><td class='it'>City Tour Half-Day (Std)</td><td>5 jam</td><td class='add'>RM 800</td></tr>\n<tr><td class='it'>City Tour Full-Day (Std)</td><td>10 jam</td><td class='add'>RM 1,500</td></tr>\n<tr><td class='it'>Winter Snow Trip (Mt Buller/Lake Mtn)</td><td>12 jam</td><td class='add'>RM 3,200</td></tr>\n</tbody></table>\n<p class='custnote'>Harga transport dikongsi seluruh group. Winter Snow Trip termasuk vehicle entrance & tyre snow chains.</p></div>\n<div class='custblk'><h3>Tiket Aktiviti (per pax)</h3>\n<table class='ctbl'><thead><tr><th>Aktiviti</th><th>Harga</th><th>Nota</th></tr></thead><tbody>\n<tr><td class='it'>Puffing Billy Steam Train</td><td class='add'>Adult RM 190 / Child RM 95</td><td>Belgrave–Lakeside</td></tr>\n<tr><td class='it'>Enchanted Adventure (Mornington)</td><td class='add'>Adult RM 120 / Child RM 90</td><td>—</td></tr>\n<tr><td class='it'>Sealife Aquarium (City)</td><td class='add'>RM 175</td><td>—</td></tr>\n<tr><td class='it'>Snow Trip entrance</td><td class='add'>RM 85</td><td>Mt Buller / Mt Baw Baw</td></tr>\n</tbody></table></div>\n<div class='custblk'><h3>Add-On Lain</h3>\n<table class='ctbl'><thead><tr><th>Item</th><th>Harga</th><th>Nota</th></tr></thead><tbody>\n<tr><td class='it'>ETA Visa Application</td><td class='add'>RM 70/pax</td><td>Fee AUD20 ke AU Immigration</td></tr>\n<tr><td class='it'>Pocket WiFi RoamingMan</td><td class='add'>RM 200 (3GB) / RM 140 (6GB whole trip)</td><td>—</td></tr>\n<tr><td class='it'>Travel Ta     "surcharge": "<h2>Surcharge</h2>\n<div class='custblk'><table class='ctbl'><thead><tr><th>Item</th><th>Caj</th><th>Bila</th></tr></thead><tbody>\n<tr><td class='it'>Peak Season (school holiday)</td><td class='add'>+RM 125/pax/malam</td><td>20–30 Sep 2026 · 30 Okt–8 Nov 2026</td></tr>\n<tr><td class='it'>Peak Season (festive)</td><td class='add'>+RM 125/pax/malam</td><td>1 Dis 2026–31 Jan 2027 · 1 Mac–12 Apr 2027</td></tr>\n<tr><td class='it'>4★ Hotel Upgrade</td><td class='add'>+RM 125/pax/malam</td><td>Grand Chancellor / Apart'hotel</td></tr>\n<tr><td class='it'>Single Supplement</td><td class='add'>+RM 2,500/pax</td><td>Bilik single occupancy</td></tr>\n<tr><td class='it'>Extra Hour Transport + Guide</td><td class='add'>AUD 50/jam</td><td>Selepas 10 jam (Basic) / 12 jam (Std) — tunai kepada pemandu</td></tr>\n<tr><td class='it'>Late Booking</td><td class='add'>+RM 50/booking</td><td>Tempahan &lt;45 hari sebelum berlepas</td></tr>\n<tr><td class='it'>Special Event Date</td><td class='add'>Enquire</td><td>Christmas / New Year / CNY — sila tanya sebelum booking</td></tr>\n</tbody></table></div>\n<div class='custblk'><h3>Peak Season Surcharge — Rate Card 2026 / 2027</h3>\n<table class='ctbl'><thead><tr><th>Item</th><th>Caj</th><th>Tarikh / Nota</th></tr></thead><tbody>\n<tr><td class='it'>Peak Season (Melbourne Basic &amp; Standard)</td><td class='add'>RM 150/pax/malam</td><td>1–15 Mac 2026 · 19 Mac–5 Apr 2026 · 20–30 Sept 2026 · 20 Okt–15 Nov 2027 · 1 Dis 2026–31 Jan 2027</td></tr>\n<tr><td class='it'>Travel Date 2027 (1 Jan–30 Jun 2027)</td><td class='add'>+RM 100/pax</td><td>Tambahan atas surcaj peak season (jika ada)</td></tr>\n<tr><td class='it'>Late Booking (&lt;45 hari)</td><td class='add'>+RM 50/pax</td><td>2 pax &amp; ke atas</td></tr>\n</tbody></table>\n<p class='custnote'>Sumber: rate card rasmi 2026/2027 Date Surcharge. Nota: katalog PDF lama menyenaraikan RM125/pax/malam — sila sahkan kadar terkini dengan PO.</p></div>",
    "transport": "<h2>Transportation & Guide</h2>\n<div class='custblk'><table class='ctbl'><thead><tr><th>Pax</th><th>Kenderaan</th><th>Nota</th></tr></thead><tbody>\n<tr><td class='it'>2–3</td><td>5-seater car</td><td>Private, driver-cum-guide</td></tr>\n<tr><td class='it'>4–6</td><td>7/8-seater van</td><td>Private, driver-cum-guide</td></tr>\n<tr><td class='it'>7–10</td><td>12-seater van</td><td>Private, driver-cum-guide</td></tr>\n<tr><td class='it'>11+</td><td>Kenderaan tambahan</td><td>Sila minta sebut harga group besar</td></tr>\n</tbody></table>\n<p class='custnote'>Driver-cum-guide warga Malaysia yang menetap di Melbourne. Basic = 10 jam/hari, Standard = 12 jam/hari. Extra hour AUD50/jam wajib bayar tunai kepada pemandu. Return private airport transfer termasuk.</p></div>",

  "snapshot": "# PT Melbourne — Knowledge Base (Important Notes · FAQ)\n\n## 1. IMPORTANT NOTES (Polisi Pakej)\n\n*Dua varian 5D4N: **Basic** (Phillip Island + Melbourne City & shopping) dan **Standard** (Penguin Parade + Great Ocean Road). Kedua-dua Ground + Tipping — tanpa tiket flight.*\n\n- Harga sah 24 jam selepas quotation dihantar.\n- Harga adalah untuk 2–3 orang sebilik.\n- Deposit RM1,000/pax; full payment 45 hari sebelum tarikh berlepas.\n- Late Booking Surcharge RM50/booking untuk tempahan kurang 45 hari sebelum berlepas.\n- Single Supplement RM2,500/pax untuk bilik single occupancy.\n- Extra hour transport & guide AUD50/jam — wajib bayar tunai kepada pemandu.\n- Final itinerari & hotel disahkan 14 hari sebelum trip.\n- Peak Season Surcharge RM125/pax/malam (school holiday & festive) — lihat tab Surcharge.\n- Special Event Date (Christmas/New Year/CNY) surcharge tidak termasuk — sila enquire sebelum booking.\n- Pakej untuk travel period hingga 31 Mac 2027 — sahkan validity terkini dengan consultant.\n- Passport perlu sah minimum 6 bulan dari tarikh berlepas.\n- ETA Visa Australia diperlukan — bantuan permohonan disediakan; fee AUD20 dibayar sendiri.\n\n## 3. FAQ\n\n### A. Pakej & Itinerari\n\n**Pakej Melbourne ni betul-betul ALL-IN?**\nTidak sepenuhnya ALL-IN. Termasuk hotel 3★, sarapan (Standard), private transport, driver-cum-guide, dan tiket Maru Koala / Churchill Island (serta Penguin Parade untuk Standard). **Tidak** termasuk flight, visa AUD20, insurance, lunch & dinner, dan extra hours.\n\n**Apa beza Standard vs Basic?**\n**Standard** — transport 12 jam/hari, sarapan hotel setiap hari, Penguin Parade termasuk, dan Great Ocean Road penuh sebagai Day 3. **Basic** — transport 10 jam/hari, tiada sarapan, tiada Penguin Parade, dan Melbourne City sebagai Day 3 (Great Ocean Road boleh ditambah sebagai add-on).\n\n**Apa kelebihan ARBA berbanding pakej lain?**\nPemandu-cum-guide warga Malaysia yang menetap di Melbourne, bantuan permohonan visa, hentian makan di restoran halal/Muslim-friendly, dan hotel di City Centre dalam Free Tram Zone. Ini Private Tour — transport & guide eksklusif untuk group anda (tiada mixed group / tiada compulsory shop).\n\n**Tempat mana akan dilawat?**\nPhillip Island (Maru Koala, Churchill Island, San Remo Pelican, The Nobbies, Penguin Parade untuk Std), Great Ocean Road (Twelve Apostles, Loch Ard Gorge, Apollo Bay — Std), dan Melbourne City (Flinders St, Federation Square, Queen Victoria Market, Brighton Beach — Basic).\n\n**Boleh customize itinerary?**\nYa. Day 4 adalah Free & Easy — boleh pilih Add-On Private Day Tour (Great Ocean Road, Mornington Peninsula, Puffing Billy, City Tour, atau Winter Snow Trip). Lihat tab Simple Customisation.\n\n**Ada tourist trap atau compulsory shop?**\nTiada. Ini Private Tour — pengangkutan dan pemandu khas untuk kumpulan anda sahaja, tiada lawatan kedai paksaan.\n\n### B. Halal, Makanan & Solat\n\n**Makanan halal senang dapat di Melbourne?**\nYa, terutama di CBD. Antara pilihan: Swanston Halal Food Centre, restoran halal di Lonsdale St & Elizabeth St, dan gerai halal-friendly di Queen Victoria Market. Driver-guide akan bawa ke restoran halal/Muslim-friendly (menu Asia, Middle Eastern & Western).\n\n**Akan makan apa sepanjang tour?**\nSarapan di hotel (Standard). Lunch & dinner di restoran halal/Muslim-friendly yang diatur driver-guide (own expense). Untuk day tour ke luar bandar (Phillip Island / Great Ocean Road), disyorkan bawa bekal halal kerana pilihan terhad di laluan.\n\n**Ada masjid/surau untuk solat?**\nDi CBD ada musalla, contohnya di 131 Queen Street (Melbourne CBD). Terdapat juga masjid di beberapa pinggir bandar. Untuk waktu di bandar, solat mudah diuruskan di musalla atau di hotel.\n\n**Macam mana nak solat masa day tour ke Phillip Island / Great Ocean Road?**\nKebanyakan tarikan luar bandar tiada surau. Driver-guide (warga Malaysia Muslim) akan atur perhentian solat dan boleh gabung (jamak) Zohor/Asar atau Maghrib/Isyak ikut jadual. Disyorkan bawa sejadah & telekung sendiri.\n\n### C. Visa & Passport\n\n**Perlu visa ke Australia?**\nYa — ETA Visa Australia (Electronic Travel Authority). ARBA sediakan bantuan permohonan (sesi online percuma atau appointment di pejabat). Fee AUD20 dibayar sendiri kepada Australian Immigration melalui app rasmi.\n\n**Passport kena sah berapa lama?**\nMinimum 6 bulan dari tarikh berlepas, dan perlu e-Passport (ada chip) untuk ETA app.\n\n**Bila kena apply visa?**\nDisyorkan apply awal — sehingga 90 hari (3 bulan) sebelum trip. Kelulusan biasanya cepat (kerap instant), tetapi tertakluk keputusan Australian Immigration.\n\n### D. Flight & Airport\n\n**Naik flight apa ke Melbourne?**\nTerdapat penerbangan direct KUL–Melbourne (~8 jam) oleh Malaysia Airlines dan AirAsia X. Pakej ini Ground only — tiket flight ditempah berasingan.\n\n**Pakej termasuk flight?**\nTidak. Pakej Melbourne adalah Ground + Tipping sahaja (tanpa tiket flight). Kami boleh bantu jika perlu cadangan jadual.\n\n**Berapa kg bagasi?**\nIkut polisi airline yang anda tempah sendiri (pakej Ground). Sila semak alauan bagasi & in-flight meal dengan airline.\n\n### E. Hotel & Bilik\n\n**Hotel di mana?**\n3★ di City Centre dalam Free Tram Zone (Ibis Melbourne atau setaraf) — mudah bergerak dengan tram percuma. Upgrade 4★ (Grand Chancellor / Apart'hotel) +RM125/pax/malam.\n\n**Bilik macam mana?**\nTwin atau triple sharing (2–3 orang sebilik). Single supplement RM2,500/pax untuk bilik sendiri.\n\n**Boleh guna hotel lain atau upgrade?**\nBoleh. Default 3★ City Centre. Upgrade ke 4★ Grand Chancellor +RM125/pax/malam, atau Apart'hotel atas permintaan.\n\n### F. Cuaca & Musim\n\n**Bila musim terbaik ke Melbourne?**\nAutumn (Mac–Mei) paling selesa & kurang sesak untuk Great Ocean Road & Phillip Island. Spring (Sep–Nov) untuk Tulip Festival & penguin chick season. Summer (Dis–Feb) hangat untuk cherry picking. Winter (Jun–Ogos) untuk Snow Trip.\n\n**Boleh tengok salji?**\nYa — add-on Winter Snow Trip ke Mt Buller, Mt Baw Baw atau Lake Mountain (musim Jun–Sep). RM3,200/transport + RM85/pax entrance.\n\n**Cuaca Melbourne berubah cepat?**\nYa — Melbourne terkenal dengan \"4 seasons in one day\". Sentiasa bawa jaket nipis, payung kecil, dan kasut selesa. Suhu boleh berubah ~10°C dalam sehari.\n\n### G. Shopping & Duit\n\n**Beli / shopping apa di Melbourne?**\nQueen Victoria Market (souvenir & produk segar), DFO South Wharf (outlet mall), Bourke Street Mall & Melbourne Central. Coklat Phillip Island juga popular sebagai buah tangan.\n\n**Boleh guna kad kredit/debit?**\nYa — Melbourne bandar hampir cashless; kad diterima hampir di mana-mana. Namun caj extra hour transport wajib bayar tunai AUD kepada pemandu.\n\n**Bawa duit tunai berapa?**\nCadangan RM1,500–3,000/pax tunai (AUD) untuk makan, tiket extra & belanja peribadi. Selebihnya boleh guna kad.\n\n### H. Payment & Refund\n\n**Berapa deposit?**\nRM1,000/pax untuk sahkan tempahan.\n\n**Bila full payment?**\n45 hari sebelum tarikh berlepas.\n\n**Kenapa harga berbeza ikut tarikh?**\nPeak Season Surcharge RM125/pax/malam dikenakan untuk school holidays (Sep, Okt–Nov) & festive (Dis–Jan, Easter Mac–Apr). Special event (Christmas/NY/CNY) dikira berasingan.\n\n### I. Add-ons & Customization\n\n**Ada add-on private day tour apa?**\nGreat Ocean Road (Basic, RM2,800), Puffing Billy & Dandenong (RM1,500), Mornington Peninsula (RM1,600), City Tour Half/Full-Day (Std, RM800/RM1,500), dan Winter Snow Trip (RM3,200). Lihat tab Simple Customisation.\n\n**Berapa caj kalau guna transport lebih jam?**\nAUD50/jam selepas 10 jam (Basic) / 12 jam (Standard) — bayar tunai kepada pemandu.\n\n### J. Kesihatan & Keselamatan\n\n**Sesuai untuk warga emas atau berkerusi roda?**\nSesuai untuk warga emas — hotel di Free Tram Zone memudahkan pergerakan. Untuk berkerusi roda, kebanyakan spot di Phillip Island & Great Ocean Road ada walkway papan & ramp; maklumkan awal supaya guide boleh rancang laluan sesuai.\n\n**Perlu travel insurance?**\nSangat disyorkan. Travel Takaful (TripCare 360) tersedia sebagai add-on dari RM64/pax.\n\n### K. Praktikal (SIM / Socket / Internet)\n\n**Macam mana untuk internet di Melbourne?**\nPocket WiFi RoamingMan tersedia sebagai add-on (RM200 untuk 3GB 4G atau RM140 untuk 6GB whole trip). eSIM carrier Australia (Telstra/Optus) juga pilihan.\n\n**Plug elektrik jenis apa di Australia?**\nType I (3-pin serong). Voltan 230V/50Hz. Perlu universal travel adapter untuk plug Malaysia (Type G).\n\n### L. Packing\n\n**Apa patut bawa / pack?**\nJaket nipis + payung kecil (cuaca 4 musim sehari), kasut selesa untuk banyak berjalan, sejadah & telekung, bekal snek halal untuk day tour luar bandar, adapter Type I, dan tunai AUD untuk extra hour transport.\n"
}

/* --- markdown engine --- */
function renderBody(lines){let html="",i=0;while(i<lines.length){let ln=lines[i];
  if(/^\s*\|.*\|\s*$/.test(ln)){const t=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){t.push(lines[i]);i++;}html+=renderTable(t);continue;}
  if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
  if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}return html;}
function renderTable(rows){rows=rows.filter(r=>!/^\s*\|[\s\-|:]+\|\s*$/.test(r));const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());if(!rows.length)return"";
  let h="<table class='kb'><thead><tr>"+cells(rows[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
  for(let r=1;r<rows.length;r++)h+="<tr>"+cells(rows[r]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";return h+"</tbody></table>";}
function parse(md){const lines=unescapeMd(md).split(/\r?\n/);const secs=[];let cur=null,subs=null,i=0;
  while(i<lines.length){const ln=lines[i];
    if(/^##\s+/.test(ln)){const title=ln.replace(/^##\s+/,"").trim();cur={title,id:slug(title),type:/FAQ/i.test(title)?"faq":"info",intro:[],cats:[]};secs.push(cur);subs=null;i++;continue;}
    if(cur){
      if(cur.type==="faq"&&/^###\s+/.test(ln)){subs={title:ln.replace(/^###\s+/,"").trim(),qas:[]};subs.id=slug(subs.title);cur.cats.push(subs);i++;continue;}
      if(cur.type==="faq"&&subs){const m=ln.match(/^\*\*(.+?)\*\*\s*$/);
        if(m){const q=m[1];const body=[];i++;while(i<lines.length&&!/^\*\*(.+?)\*\*\s*$/.test(lines[i])&&!/^###\s+/.test(lines[i])&&!/^##\s+/.test(lines[i])){body.push(lines[i]);i++;}subs.qas.push({q,body});continue;}
        i++;continue;}
      cur.intro.push(ln);i++;continue;}
    i++;}
  return secs;}

/* topics: fixed order. blocks (pricing/custom/surcharge/transport/stay) come from KB.blocks */
const TOPICS=[
 {id:"compare",t:"Perbezaan Pakej"},
 {id:"itin",t:"Itinerary & Aktiviti"},{id:"pricing",t:"Harga & Pakej"},{id:"custom",t:"Simple Customisation"},
 {id:"surcharge",t:"Surcharge"},{id:"transport",t:"Transportation & Guide"},{id:"stay",t:"Accommodation"},
 {id:"food",t:"Halal & Makanan"},{id:"flight",t:"Flight & Airport"},{id:"prayer",t:"Solat"},
 {id:"weather",t:"Cuaca & Musim"},{id:"tips",t:"Shopping & Tips"},{id:"visa",t:"Visa & Passport"},
 {id:"freegift",t:"Free Gift (Promo)"},
 {id:"polisi",t:"Polisi & Payment"},
];
const CATMAP={a:"itin",i:"custom",e:"stay",d:"flight",f:"weather",g:"tips",j:"tips",k:"tips",l:"tips",c:"visa",h:"polisi"};
const PRAYER_RE=/solat|masjid|surau|qiblat|subuh|sembahyang|telekung|sejadah/i;
function topicOf(letter,q,body){letter=(letter||"").toLowerCase();
  if(letter==="b")return PRAYER_RE.test((q||"")+" "+(body||[]).join(" "))?"prayer":"food";
  return CATMAP[letter]||"itin";}
function infoHtml(s){
  const body=s.intro.slice();let sub=null;
  for(let k=0;k<body.length;k++){if(/^\*[^*].*\*$/.test(body[k].trim())){sub=body[k].trim().replace(/^\*|\*$/g,"");body.splice(k,1);break;}}
  let html=sub?"<div class='subtitle'>"+esc(sub)+"</div>":"";let i=0;
  while(i<body.length){let ln=body[i];
    if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<body.length&&/^\s*[-*]\s+/.test(body[i])){it.push(body[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul class='klist'>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)){let t=[];while(i<body.length&&/^\s*\|.*\|\s*$/.test(body[i])){t.push(body[i]);i++;}html+=renderTable(t);continue;}
    if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}
  return html;}

function build(md){
  const secs=parse(md);const cont=$("#content");cont.innerHTML="";
  const info={},qs={};TOPICS.forEach(t=>qs[t.id]=[]);
  secs.forEach(s=>{
    if(s.type==="info"){info["polisi"]=(info["polisi"]||"")+"<div class='infosub'>"+esc(s.title.replace(/^\d+\.\s*/,""))+"</div>"+infoHtml(s);}
    else{s.cats.forEach(cat=>{const letter=(cat.title.match(/^([A-Z])\./)||[])[1];cat.qas.forEach(qa=>{qs[topicOf(letter,qa.q,qa.body)].push(qa);});});}
  });
  TOPICS.forEach(tp=>{
    if(!qs[tp.id].length && !info[tp.id])return;
    const sec=document.createElement("section");sec.className="block hidden";sec.dataset.topic=tp.id;sec.id="topic-"+tp.id;
    sec.innerHTML="<h2>"+esc(tp.t)+"</h2>"+(info[tp.id]||"");
    qs[tp.id].forEach(qa=>{const halal=HALAL_RE.test(qa.q+" "+qa.body.join(" "));
      const d=document.createElement("details");d.className="qa";d.dataset.text=(qa.q+" "+qa.body.join(" ")).toLowerCase();
      d.innerHTML="<summary><span class='tw'>▶</span><span>"+inline(qa.q)+(halal?"<span class='badge-halal'>halal/solat</span>":"")+"</span></summary><div class='ans'>"+renderBody(qa.body)+"</div>";
      sec.appendChild(d);});
    cont.appendChild(sec);
  });
  const B=KB.blocks||{};
  [["compare",B.compare],["pricing",B.pricing],["custom",B.custom],["surcharge",B.surcharge],["transport",B.transport],["stay",B.stay],["freegift",B.freegift]].forEach(function(b){
    if(!b[1])return;
    const existing=document.querySelector('.block[data-topic="'+b[0]+'"]');
    if(existing){existing.insertAdjacentHTML("beforeend",b[1].replace(/^\s*<h2>[\s\S]*?<\/h2>/,""));}
    else{const s=document.createElement("section");s.className="block hidden";s.dataset.topic=b[0];s.id="topic-"+b[0];s.innerHTML=b[1];cont.appendChild(s);}
  });
  var _stay=document.querySelector('.block[data-topic="stay"]');if(_stay)_stay.insertAdjacentHTML("beforeend",renderHotels());
  var _itin=document.querySelector('.block[data-topic="itin"]');if(_itin){var _h2=_itin.querySelector("h2");if(_h2)_h2.insertAdjacentHTML("afterend",'<p class="ssub" style="margin:8px 0 6px">Highlight aktiviti ikut kawasan</p>'+renderActs());}
  renderTabs();
  if(($("#q").value||"").trim())applyFilter();else showTopic(CURRENT);
}
function renderTabs(){
  const list=[{id:"all",t:"Overview"}].concat(TOPICS.filter(t=>document.querySelector('.block[data-topic="'+t.id+'"]')));
  $("#topicbar").innerHTML=list.map(t=>`<button class="tab${t.id===CURRENT?' active':''}" data-id="${t.id}" onclick="showTopic('${t.id}')">${esc(t.t)}</button>`).join("");
}
function showTopic(id){CURRENT=id;$("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore .tcard").forEach(c=>c.style.display="");
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  const all=id==="all";
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  document.querySelectorAll(".explore").forEach(e=>e.classList.toggle("hidden",!all));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.toggle("hidden",all||b.dataset.topic!==id));
  document.querySelectorAll("details.qa").forEach(d=>{d.classList.remove("hidden");d.open=false;});
  $("#noresult").style.display="none";
  if(all)window.scrollTo({top:0,behavior:"smooth"});
  else{const el=document.querySelector('.block[data-topic="'+id+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
}
function applyFilter(){
  const q=($("#q").value||"").trim().toLowerCase();
  if(!q){showTopic(CURRENT);return;}
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.remove("active"));
  let any=false;
  document.querySelectorAll("details.qa").forEach(d=>{const show=d.dataset.text.includes(q);d.classList.toggle("hidden",!show);d.open=show;if(show)any=true;});
  document.querySelectorAll("#content .block").forEach(b=>{
    const hasQA=!!b.querySelector("details.qa");
    const qaMatch=hasQA && b.querySelectorAll("details.qa:not(.hidden)").length>0;
    const textMatch=(b.textContent||"").toLowerCase().includes(q);
    const show=hasQA?(qaMatch||textMatch):textMatch;
    b.classList.toggle("hidden",!show); if(show)any=true;
  });
  document.querySelectorAll(".explore").forEach(sec=>{
    let secAny=false;
    sec.querySelectorAll(".tcard").forEach(c=>{const mm=(c.textContent||"").toLowerCase().includes(q);c.style.display=mm?"":"none";if(mm)secAny=true;});
    sec.classList.toggle("hidden",!secAny); if(secAny)any=true;
  });
  $("#noresult").style.display=any?"none":"block";
}
function sync(from,to){to.value=from.value;applyFilter();}
